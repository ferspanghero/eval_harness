[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-harness"
version = "0.1.0"
description = "Behavioral eval harness for the /dev-pipeline workflow"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
eval-harness = "eval_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-branch --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py310"
# Sample eval data (seed code + agent-produced artifacts) is not production code — linting it is a
# category error; this mirrors mypy's `files = ["src", "tests"]` scope.
extend-exclude = ["samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
